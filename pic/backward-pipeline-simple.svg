<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 330" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <rect width="1240" height="330" fill="#ffffff"/>

  <!-- chip -->
  <rect x="32" y="18" width="128" height="32" rx="6" fill="#4a90d9"/>
  <text x="96" y="40" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">BACKWARD</text>

  <!-- lane labels -->
  <text x="40" y="106" font-size="14.5" font-weight="700" fill="#1f2937">AIV 通信/向量</text>
  <text x="40" y="186" font-size="14.5" font-weight="700" fill="#1f2937">AIC 计算</text>

  <!-- lane guides -->
  <line x1="180" y1="126" x2="1220" y2="126" stroke="#e5e7eb" stroke-width="1.2"/>
  <line x1="180" y1="206" x2="1220" y2="206" stroke="#e5e7eb" stroke-width="1.2"/>

  <!-- phase labels -->
  <text x="365" y="56" text-anchor="middle" font-size="12.5" font-weight="700" fill="#64748b">P1</text>
  <text x="627" y="56" text-anchor="middle" font-size="12.5" font-weight="700" fill="#64748b">P2 ∥ P3</text>
  <text x="819" y="56" text-anchor="middle" font-size="12.5" font-weight="700" fill="#64748b">P4a</text>
  <text x="981" y="56" text-anchor="middle" font-size="12.5" font-weight="700" fill="#64748b">P4b ∥ P5a</text>
  <text x="1113" y="56" text-anchor="middle" font-size="12.5" font-weight="700" fill="#64748b">P4c ∥ P5b</text>

  <!-- barriers -->
  <line x1="520" y1="60" x2="520" y2="216" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="527" y="72" font-size="11.5" font-weight="700" fill="#94a3b8">B1</text>
  <line x1="722" y1="60" x2="722" y2="216" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="729" y="72" font-size="11.5" font-weight="700" fill="#94a3b8">B2</text>
  <line x1="904" y1="60" x2="904" y2="216" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="911" y="72" font-size="11.5" font-weight="700" fill="#94a3b8">B3</text>
  <line x1="1046" y1="60" x2="1046" y2="216" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="1053" y="72" font-size="11.5" font-weight="700" fill="#94a3b8">B4</text>

  <!-- lane1: AIV 通信/向量 -->
  <rect x="210" y="70" width="310" height="56" rx="8" fill="#f2994a"/>
  <text x="365" y="104" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">P1 dispatch-A2A</text>
  <rect x="532" y="70" width="110" height="56" rx="8" fill="#7e57c2"/>
  <text x="587" y="104" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">P2 swiglu 反向</text>
  <rect x="734" y="70" width="170" height="56" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="819" y="104" text-anchor="middle" font-size="13" fill="#94a3b8">vector 空转</text>
  <rect x="916" y="70" width="130" height="56" rx="8" fill="#f2994a"/>
  <text x="981" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">P4b push</text>
  <rect x="1058" y="70" width="110" height="56" rx="8" fill="#7e57c2"/>
  <text x="1113" y="104" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">P4c top-k 求和</text>

  <!-- lane2: AIC 计算 -->
  <rect x="210" y="150" width="130" height="56" rx="8" fill="#4a90d9"/>
  <text x="275" y="184" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">P1 fc2 dgrad</text>
  <rect x="340" y="150" width="180" height="56" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="430" y="184" text-anchor="middle" font-size="13" fill="#94a3b8">cube 等料（fill）</text>
  <rect x="532" y="150" width="190" height="56" rx="8" fill="#4a90d9"/>
  <text x="627" y="184" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">P3 fc2 wgrad</text>
  <rect x="734" y="150" width="170" height="56" rx="8" fill="#4a90d9"/>
  <text x="819" y="184" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">P4a fc1 dgrad</text>
  <rect x="916" y="150" width="130" height="56" rx="8" fill="#4a90d9"/>
  <text x="981" y="184" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">P5a wgrad 前半</text>
  <rect x="1058" y="150" width="110" height="56" rx="8" fill="#4a90d9"/>
  <text x="1113" y="184" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">P5b wgrad 后半</text>

  <!-- bottom callouts -->
  <text x="365" y="245" text-anchor="middle" font-size="12.5" fill="#64748b">边收边算：通信 bound，cube 等料</text>
  <text x="627" y="245" text-anchor="middle" font-size="12.5" fill="#64748b">引擎分工</text>
  <text x="1047" y="245" text-anchor="middle" font-size="12.5" fill="#64748b">P5 借窗口</text>
</svg>
