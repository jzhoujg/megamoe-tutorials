<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 500" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#475569"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d97706"/>
    </marker>
    <marker id="arrGray" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <style>
    .t   { fill:#1f2937; }
    .dim { fill:#64748b; }
    .box { fill:#f1f5f9; stroke:#94a3b8; stroke-width:1.2; rx:8; }
    .attn{ fill:#dbeafe; stroke:#60a5fa; stroke-width:1.4; }
    .ffn { fill:#e5e7eb; stroke:#9ca3af; stroke-width:1.2; }
    .moe { fill:#ffedd5; stroke:#f97316; stroke-width:2.4; }
    .amber{ fill:#fef3c7; stroke:#f59e0b; stroke-width:1.6; }
    .amberL{ fill:#fde68a; stroke:#f59e0b; stroke-width:1.6; }
    .sel { fill:#ffedd5; stroke:#f97316; stroke-width:1.8; }
    .cold{ fill:#f3f4f6; stroke:#cbd5e1; stroke-width:1.2; stroke-dasharray:4 3; }
    .sum { fill:#dbeafe; stroke:#60a5fa; stroke-width:1.6; }
    .flow{ stroke:#475569; stroke-width:1.6; fill:none; marker-end:url(#arr); }
    .fan { stroke:#f97316; stroke-width:1.5; fill:none; marker-end:url(#arrGray); }
    .w   { stroke:#d97706; stroke-width:1.5; fill:none; stroke-dasharray:5 4; marker-end:url(#arrAmber); }
    .zoom{ stroke:#cbd5e1; stroke-width:1.4; fill:none; stroke-dasharray:5 4; }
    .repl{ stroke:#94a3b8; stroke-width:1.5; fill:none; stroke-dasharray:5 4; marker-end:url(#arrGray); }
  </style>

  <!-- ══════════ 面板 A：transformer block ══════════ -->
  <text x="275" y="42" text-anchor="middle" font-size="16" font-weight="700" class="t">transformer block</text>

  <!-- 经典列 -->
  <text x="150" y="24" text-anchor="middle" font-size="12" class="dim">经典</text>
  <rect x="106" y="38" width="88" height="26" rx="13" class="box"/>
  <text x="150" y="55" text-anchor="middle" font-size="12.5" class="t">x</text>
  <line x1="150" y1="64" x2="150" y2="80" class="flow"/>
  <rect x="55" y="84" width="190" height="50" rx="8" class="attn"/>
  <text x="150" y="113" text-anchor="middle" font-size="14" class="t">Attention</text>
  <line x1="150" y1="134" x2="150" y2="158" class="flow"/>
  <rect x="55" y="162" width="190" height="44" rx="8" class="box"/>
  <text x="150" y="189" text-anchor="middle" font-size="13" class="t">Add &amp; Norm</text>
  <line x1="150" y1="206" x2="150" y2="230" class="flow"/>
  <rect x="55" y="234" width="190" height="50" rx="8" class="ffn"/>
  <text x="150" y="263" text-anchor="middle" font-size="14" class="t">FFN</text>
  <line x1="150" y1="284" x2="150" y2="308" class="flow"/>
  <rect x="55" y="312" width="190" height="44" rx="8" class="box"/>
  <text x="150" y="339" text-anchor="middle" font-size="13" class="t">Add &amp; Norm</text>
  <line x1="150" y1="356" x2="150" y2="374" class="flow"/>
  <rect x="106" y="378" width="88" height="26" rx="13" class="box"/>
  <text x="150" y="395" text-anchor="middle" font-size="12.5" class="t">out</text>

  <!-- 现代列 -->
  <text x="400" y="24" text-anchor="middle" font-size="12" class="dim">现代</text>
  <rect x="356" y="38" width="88" height="26" rx="13" class="box"/>
  <text x="400" y="55" text-anchor="middle" font-size="12.5" class="t">x</text>
  <line x1="400" y1="64" x2="400" y2="80" class="flow"/>
  <rect x="305" y="84" width="190" height="50" rx="8" class="attn"/>
  <text x="400" y="113" text-anchor="middle" font-size="14" class="t">Attention</text>
  <line x1="400" y1="134" x2="400" y2="158" class="flow"/>
  <rect x="305" y="162" width="190" height="44" rx="8" class="box"/>
  <text x="400" y="189" text-anchor="middle" font-size="13" class="t">Add &amp; Norm</text>
  <line x1="400" y1="206" x2="400" y2="230" class="flow"/>
  <rect x="305" y="234" width="190" height="50" rx="8" class="moe"/>
  <text x="400" y="264" text-anchor="middle" font-size="14.5" font-weight="700" class="t">MoE（分诊台）</text>
  <line x1="400" y1="284" x2="400" y2="308" class="flow"/>
  <rect x="305" y="312" width="190" height="44" rx="8" class="box"/>
  <text x="400" y="339" text-anchor="middle" font-size="13" class="t">Add &amp; Norm</text>
  <line x1="400" y1="356" x2="400" y2="374" class="flow"/>
  <rect x="356" y="378" width="88" height="26" rx="13" class="box"/>
  <text x="400" y="395" text-anchor="middle" font-size="12.5" class="t">out</text>

  <!-- 替换箭头 -->
  <line x1="247" y1="259" x2="301" y2="259" class="repl"/>
  <text x="274" y="248" text-anchor="middle" font-size="11.5" class="dim">被替换</text>

  <text x="275" y="436" text-anchor="middle" font-size="13" class="dim">× N 层</text>

  <!-- 放大虚线：MoE → 面板 B -->
  <line x1="497" y1="236" x2="568" y2="70" class="zoom"/>
  <line x1="497" y1="284" x2="568" y2="462" class="zoom"/>

  <!-- ══════════ 面板 B：MoE 内部 ══════════ -->
  <rect x="570" y="60" width="590" height="410" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="865" y="90" text-anchor="middle" font-size="16" font-weight="700" class="t">MoE 内部</text>

  <!-- 输入 -->
  <rect x="600" y="150" width="90" height="28" rx="14" class="box"/>
  <text x="645" y="169" text-anchor="middle" font-size="12.5" class="t">x</text>
  <line x1="690" y1="164" x2="716" y2="164" class="flow"/>

  <!-- router -->
  <rect x="720" y="142" width="160" height="44" rx="10" class="amber"/>
  <text x="800" y="169" text-anchor="middle" font-size="14.5" font-weight="700" class="t">router</text>
  <line x1="800" y1="186" x2="800" y2="238" class="flow"/>

  <!-- top-k -->
  <rect x="720" y="242" width="160" height="56" rx="10" class="amberL"/>
  <text x="800" y="266" text-anchor="middle" font-size="14.5" font-weight="700" class="t">top-k</text>
  <text x="800" y="288" text-anchor="middle" font-size="12" class="dim">896 挑 16</text>

  <!-- 专家区标题 -->
  <text x="1050" y="134" text-anchor="middle" font-size="12.5" class="dim">E 个专家</text>

  <!-- 选中的专家 -->
  <rect x="950" y="150" width="100" height="36" rx="8" class="sel"/>
  <text x="1000" y="173" text-anchor="middle" font-size="12.5" font-weight="700" class="t">专家 3</text>
  <rect x="950" y="196" width="100" height="36" rx="8" class="sel"/>
  <text x="1000" y="219" text-anchor="middle" font-size="12.5" font-weight="700" class="t">专家 7</text>
  <rect x="950" y="242" width="100" height="36" rx="8" class="sel"/>
  <text x="1000" y="265" text-anchor="middle" font-size="12.5" font-weight="700" class="t">专家 42</text>

  <!-- 冷宫 -->
  <rect x="1070" y="150" width="80" height="128" rx="8" class="cold"/>
  <text x="1110" y="205" text-anchor="middle" font-size="12.5" class="dim">其余 ≈880</text>
  <text x="1110" y="230" text-anchor="middle" font-size="12.5" class="dim">（冷宫）</text>

  <!-- top-k → 三个选中专家 的扇出 -->
  <line x1="882" y1="270" x2="946" y2="168" class="fan"/>
  <line x1="882" y1="270" x2="946" y2="214" class="fan"/>
  <line x1="882" y1="270" x2="946" y2="260" class="fan"/>
  <text x="884" y="322" font-size="11" class="dim">挂 k 个科</text>

  <!-- 权重 w → 求和 -->
  <path d="M 840 298 L 840 355 L 926 355" class="w"/>
  <text x="852" y="336" font-size="11" class="dim">权重 w</text>

  <!-- 专家输出 → 加权求和 -->
  <line x1="1000" y1="186" x2="978" y2="328" class="flow"/>
  <line x1="1000" y1="232" x2="1000" y2="328" class="flow"/>
  <line x1="1000" y1="278" x2="1022" y2="328" class="flow"/>

  <rect x="930" y="330" width="220" height="50" rx="10" class="sum"/>
  <text x="1040" y="360" text-anchor="middle" font-size="14" font-weight="700" class="t">Σ wk·yk</text>

  <line x1="1040" y1="380" x2="1040" y2="404" class="flow"/>
  <rect x="996" y="408" width="88" height="26" rx="13" class="box"/>
  <text x="1040" y="425" text-anchor="middle" font-size="12.5" class="t">out</text>
</svg>
